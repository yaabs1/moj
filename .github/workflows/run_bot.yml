name: Arasa News Scraper Bot

# تنظیمات مربوط به زمان و نحوه اجرا
on:
  # ۱. اجرای خودکار هر ساعت (Cron Job)
  schedule:
    - cron: '0 * * * *'
  
  # ۲. اجازه برای اجرای دستی (برای تست کردن)
  workflow_dispatch:

  # ۳. هر بار که کدی را در شاخه main آپلود می‌کنی، اجرا شود
  push:
    branches: [ main ]

jobs:
  scrape_and_send:
    runs-on: ubuntu-latest

    steps:
      # مرحله ۱: کپی کردن کدهای تو از گیت‌هاب به سرور مجازی گیت‌هاب
      - name: Checkout repository
        uses: actions/checkout@v3

      # مرحله ۲: نصب پایتون روی سرور گیت‌هاب
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # مرحله ۳: نصب کتابخانه‌های مورد نیاز (بسیار مهم)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          # اگر در آینده کتابخانه دیگری مثل BeautifulSoup اضافه کردی، اینجا اضافه کن

      # مرحله ۴: اجرای کد پایتون
      - name: Run Python Scraper
        run: python bot.py  # <--- دقت کن! اگر نام فایل پایتون تو چیز دیگری است، اینجا اصلاح کن
